name: Sync Fork with Upstream

on:
  schedule:
    - cron: "0 9 * * 2"  # Every Tuesday at 9am UTC (after Monday TidyTuesday posts)
  workflow_dispatch:       # Also allows manual trigger from GitHub Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Sync with upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/rfordatascience/tidytuesday.git
          git fetch upstream
          git checkout main
          git merge upstream/main --no-edit
          git push origin main
